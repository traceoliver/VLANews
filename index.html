<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V.L.A NEWS</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&family=Noto+Sans+SC:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg:        #0a0e1a;
    --panel:     #0f1524;
    --panel-2:   #131a2c;
    --line:      #1a2030;
    --line-2:    #232b40;
    --text:      #e5e9f0;
    --text-dim:  #7a8ba8;
    --text-mute: #4a5878;
    --accent:    #00d9a3;
    --accent-dim:#00d9a322;
    --warn:      #ff8c42;
    --gold:      #d4af37;
    --silver:    #c0c0c0;
    --bronze:    #cd7f32;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
}
.mono { font-family: 'JetBrains Mono', monospace; }

/* ============ 顶栏 ============ */
.topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 32px;
    height: 56px;
    padding: 0 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
}
.logo {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.05em;
    color: var(--accent);
    white-space: nowrap;
}
.logo span { color: var(--text-mute); font-weight: 400; }
.nav-leagues {
    display: flex;
    gap: 4px;
    flex: 1;
}
.nav-leagues a {
    padding: 6px 14px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    border-radius: 4px;
    transition: all 0.15s;
}
.nav-leagues a:hover { color: var(--text); background: var(--panel-2); }
.nav-leagues a.active {
    color: var(--accent);
    background: var(--accent-dim);
}
.btn-archive {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border: 1px solid var(--line-2);
    border-radius: 4px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    transition: all 0.15s;
    white-space: nowrap;
}
.btn-archive:hover {
    border-color: var(--accent);
    color: var(--accent);
}

/* ============ 主布局 ============ */
.layout {
    display: grid;
    grid-template-columns: 240px 1fr 320px;
    gap: 1px;
    background: var(--line);
    min-height: calc(100vh - 56px);
}
.col {
    background: var(--bg);
    padding: 20px;
}
.col-left { padding: 20px 16px; }
.col-right { padding: 20px 16px; }

/* ============ 左栏 ============ */
.panel-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--text-mute);
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.panel {
    margin-bottom: 28px;
}
.stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
}
.stat-row:last-child { border-bottom: none; }
.stat-label { color: var(--text-dim); font-size: 12px; }
.stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    color: var(--text);
}
.stat-value.accent { color: var(--accent); }

.panel-empty {
    font-size: 12px;
    color: var(--text-mute);
    padding: 4px 0;
}

/* 冠军榜的口径切换按钮 */
.panel-switch {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 8px;
}
.switch-btn {
    padding: 3px 9px;
    font-size: 10.5px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
    border: 1px solid var(--line-2);
    border-radius: 3px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
}
.switch-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
}

/* 冠军榜的滚动窗口：固定高度，内容不足则下方留空 */
.rank-scroll {
    height: 268px;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-right: 4px;
    -webkit-overflow-scrolling: touch;
}
.rank-scroll::-webkit-scrollbar { width: 6px; }
.rank-scroll::-webkit-scrollbar-track { background: transparent; }
.rank-scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
.rank-scroll::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }

/* 近期夺冠的滚动窗口 */
.recent-scroll {
    max-height: 232px;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-right: 4px;
    -webkit-overflow-scrolling: touch;
}
.recent-scroll::-webkit-scrollbar { width: 6px; }
.recent-scroll::-webkit-scrollbar-track { background: transparent; }
.recent-scroll::-webkit-scrollbar-thumb {
    background: var(--line-2);
    border-radius: 3px;
}
.recent-scroll::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }
/* 只有内容真的溢出时才做底部渐隐（由 panels.js 判断后挂 .has-overflow） */
.rank-scroll.has-overflow,
.recent-scroll.has-overflow {
    mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent 100%);
}
.recent-hint {
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-mute);
    letter-spacing: 0.06em;
    text-align: center;
}

/* ============ 中栏 ============ */
.feed-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
}
.feed-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--text);
    text-transform: uppercase;
}
.filter-bar {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 16px;
}
.filter-btn {
    padding: 4px 12px;
    font-size: 12px;
    border: 1px solid var(--line-2);
    border-radius: 3px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
}
.filter-btn:hover { color: var(--text); border-color: var(--text-mute); }
.filter-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: var(--accent);
}

/* 头条卡 */
.hero-card {
    position: relative;
    padding: 20px 20px 20px 24px;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 6px;
    margin-bottom: 16px;
    cursor: pointer;
    transition: all 0.2s;
    overflow: hidden;
}
.hero-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--warn);
}
.hero-card:hover {
    border-color: var(--warn);
    background: var(--panel-2);
}
.hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--warn);
    margin-bottom: 10px;
}
.hero-title {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.3;
    margin-bottom: 8px;
    color: var(--text);
}
.hero-summary {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.7;
    margin-bottom: 12px;
}
.card-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-mute);
}
.card-meta .sep { opacity: 0.4; }
.card-meta .tag {
    padding: 1px 6px;
    border-radius: 2px;
    background: var(--panel-2);
    color: var(--text-dim);
}

/* 普通资讯卡 */
.news-card {
    position: relative;
    padding: 14px 16px 14px 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
}
.news-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: transparent;
    transition: background 0.15s;
}
.news-card:hover {
    border-color: var(--line-2);
    background: var(--panel-2);
}
.news-card:hover::before { background: var(--accent); }
.news-title {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 6px;
    color: var(--text);
}
.news-summary {
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.65;
    margin-bottom: 10px;
}

/* 空状态 */
.empty-state {
    padding: 40px 20px;
    text-align: center;
    border: 1px dashed var(--line-2);
    border-radius: 4px;
    color: var(--text-mute);
    font-size: 13px;
}
.empty-state .mono { display: block; margin-top: 8px; font-size: 11px; }

/* 数据来源提示条 */
.src-note {
    display: none;
    margin-top: 18px;
    padding: 9px 12px;
    border: 1px dashed var(--line-2);
    border-radius: 4px;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--text-mute);
}
.src-note.show { display: block; }
.src-note b { color: var(--text-dim); font-weight: 600; }

/* ============ 右栏 ============ */
.rank-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: color 0.15s;
}
.rank-row:last-child { border-bottom: none; }
.rank-row:hover .rank-name { color: var(--accent); }
.rank-num {
    width: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-mute);
    flex-shrink: 0;
}
.rank-num.r1 { color: var(--gold); }
.rank-num.r2 { color: var(--silver); }
.rank-num.r3 { color: var(--bronze); }
.rank-name {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    transition: color 0.15s;
}
.rank-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
}
.rank-value.accent { color: var(--accent); }

.recent-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 12px;
    border-bottom: 1px solid var(--line);
}
.recent-row:last-child { border-bottom: none; }
.recent-year {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-mute);
    font-size: 11px;
    width: 38px;
    flex-shrink: 0;
}
.recent-team { flex: 1; font-weight: 600; }
.recent-type {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 2px;
    background: var(--panel-2);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
}

.heat-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    font-size: 12px;
}
.heat-name {
    width: 40px;
    flex-shrink: 0;
    color: var(--text-dim);
}
.heat-bar {
    flex: 1;
    height: 6px;
    background: var(--panel-2);
    border-radius: 3px;
    overflow: hidden;
}
.heat-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #00b389);
    border-radius: 3px;
}
.heat-pct {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-mute);
    width: 32px;
    text-align: right;
    flex-shrink: 0;
}
/* 热度加载中：数字位置显示 —，避免先闪一组临时值 */
.heat-loading .heat-pct { opacity: 0.5; }
.heat-loading .heat-fill { opacity: 0; }

/* ============ 开屏动画 ============ */
.splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #05080f;
    transition: opacity 0.5s ease, visibility 0.5s ease;
}
.splash.is-leaving {
    opacity: 0;
    visibility: hidden;
}
.splash-bg {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 50% 42%, rgba(0, 217, 163, 0.10), transparent 58%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.022) 0 1px, transparent 1px 4px);
}
.splash-inner {
    position: relative;
    text-align: center;
    padding: 0 24px;
    max-width: 720px;
}
.splash-kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: var(--text-mute);
    margin-bottom: 16px;
    animation: splash-up 0.6s 0.1s both;
}
.splash-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 52px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--text);
    line-height: 1.1;
    text-shadow: 0 0 40px rgba(0, 217, 163, 0.35);
    animation: splash-up 0.7s 0.2s both;
}
.splash-title span { color: var(--accent); }
.splash-rule {
    width: 0;
    height: 2px;
    margin: 20px auto;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: splash-rule 1.1s 0.5s forwards;
}
.splash-sub {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-dim);
    animation: splash-up 0.7s 0.9s both;
}
.splash-note {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--text-mute);
    animation: splash-up 0.7s 1.05s both;
}
.splash-foot {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 42px;
    text-align: center;
}
.splash-bar {
    width: 200px;
    height: 2px;
    margin: 0 auto 14px;
    background: var(--line-2);
    border-radius: 2px;
    overflow: hidden;
}
.splash-bar i {
    display: block;
    width: 0;
    height: 100%;
    background: var(--accent);
    animation: splash-load 1.7s 0.4s linear forwards;
}
.splash-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-mute);
    animation: splash-up 0.6s 0.6s both;
}
.splash-skip {
    position: absolute;
    top: 22px;
    right: 24px;
    padding: 5px 13px;
    border: 1px solid var(--line-2);
    border-radius: 3px;
    background: transparent;
    color: var(--text-mute);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.15s;
}
.splash-skip:hover {
    border-color: var(--accent);
    color: var(--accent);
}
@keyframes splash-up {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
}
@keyframes splash-rule {
    from { width: 0; opacity: 0; }
    to   { width: 220px; opacity: 1; }
}
@keyframes splash-load {
    from { width: 0; }
    to   { width: 100%; }
}

/* ============ 响应式 ============ */
@media (max-width: 1024px) {
    .layout {
        grid-template-columns: 1fr 320px;
    }
    .col-left { display: none; }
}
@media (max-width: 640px) {
    .topbar {
        padding: 0 14px;
        gap: 12px;
        height: 52px;
    }
    .nav-leagues { display: none; }
    .layout {
        grid-template-columns: 1fr;
    }
    .col { padding: 16px 14px; }
    .col-right { order: 2; border-top: 1px solid var(--line); }
    .hero-title { font-size: 18px; }
    .news-title { font-size: 14px; }
    .splash-title { font-size: 32px; }
    .splash-sub { font-size: 13px; }
    .splash-foot { bottom: 32px; }
}
@media (prefers-reduced-motion: reduce) {
    .splash-kicker,
    .splash-title,
    .splash-sub,
    .splash-note,
    .splash-status,
    .splash-bar i,
    .splash-rule {
        animation-duration: 0.01s;
        animation-delay: 0s;
    }
}
</style>
</head>
<body>

<!-- 开屏播报 -->
<div class="splash" id="splash">
    <div class="splash-bg"></div>
    <button class="splash-skip" id="splash-skip" type="button">跳过 SKIP</button>
    <div class="splash-inner">
        <div class="splash-kicker">VIRTUAL LEAGUE ARCHIVE</div>
        <div class="splash-title">V.L.A <span>NEWS</span></div>
        <div class="splash-rule"></div>
        <div class="splash-sub">2038 赛季 · 五大联赛 · 转录进行中</div>
        <div class="splash-note" id="splash-note">正在接入档案信号…</div>
    </div>
    <div class="splash-foot">
        <div class="splash-bar"><i></i></div>
        <div class="splash-status">SIGNAL LINK ESTABLISHED</div>
    </div>
</div>

<!-- 顶栏 -->
<div class="topbar">
    <div class="logo">V.L.A <span>NEWS</span></div>
    <nav class="nav-leagues" id="nav-leagues">
        <a href="index.html" data-league="" class="active">首页</a>
        <a href="index.html?league=华超" data-league="华超">华超</a>
        <a href="index.html?league=锐超" data-league="锐超">锐超</a>
        <a href="index.html?league=枫超" data-league="枫超">枫超</a>
        <a href="index.html?league=晴甲" data-league="晴甲">晴甲</a>
        <a href="index.html?league=辙甲" data-league="辙甲">辙甲</a>
    </nav>
    <a href="https://traceoliver.github.io/VLA/" class="btn-archive" target="_blank" rel="noopener noreferrer">🏛️ 档案馆</a>
</div>

<!-- 主体 -->
<div class="layout">

    <!-- 左栏 -->
    <aside class="col col-left">
        <div class="panel">
            <div class="panel-title">⚡ 档案状态</div>
            <div class="stat-row">
                <span class="stat-label">当前档案年</span>
                <span class="stat-value accent">2038</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">收录球队</span>
                <span class="stat-value">40</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">总助威</span>
                <span class="stat-value" id="stat-cheers">—</span>
            </div>
        </div>
    </aside>

    <!-- 中栏 -->
    <main class="col col-main">
        <div class="feed-header">
            <div class="feed-title">📰 资讯流</div>
            <div class="mono" style="font-size:11px;color:var(--text-mute)" id="feed-count">载入中…</div>
        </div>

        <!-- 筛选按钮由脚本根据数据里的 tag 自动生成 -->
        <div class="filter-bar" id="filter-bar"></div>

        <!-- 资讯卡由脚本渲染：数据来自 data.js（Supabase 或内置兜底） -->
        <div id="feed">
            <div class="empty-state">正在读取档案…</div>
        </div>

        <div class="src-note" id="src-note"></div>
    </main>

    <!-- 右栏
         这三个面板的内容都从 data.js 的 site 配置读取，改数据不用动这里 -->
    <aside class="col col-right">
        <div class="panel">
            <div class="panel-title">📊 冠军榜</div>
            <div id="panel-rank"></div>
        </div>

        <div class="panel">
            <div class="panel-title">🔥 近期夺冠</div>
            <div id="panel-recent"></div>
        </div>

        <div class="panel">
            <div class="panel-title">📈 联赛热度</div>
            <div id="panel-heat"></div>
        </div>
    </aside>

</div>

<script src="data.js"></script>
<script src="stats.js"></script>
<script src="panels.js"></script>
<script>
/* =====================================================================
   首页脚本：开屏动画 + 资讯流渲染
   ---------------------------------------------------------------------
   新增一篇资讯 = 往 Supabase 表（或 data.js 的 SAMPLE 数组）里加一条，
   这里会自动生成卡片、统计条数、生成筛选按钮，不需要改 HTML。
   ===================================================================== */
(function () {
    'use strict';

    /* ---------- 开屏动画 ---------- */
    var splash = document.getElementById('splash');
    var params = new URLSearchParams(location.search);

    /* 每次打开都播开屏（约 2.4 秒）；
       自己调页面时加 ?intro=0 可临时跳过，不影响线上访客看到的效果。 */
    if (params.get('intro') === '0') {
        if (splash) splash.remove();
        splash = null;
    } else if (splash) {
        var introDone = false;
        var hideSplash = function () {
            if (introDone) return;
            introDone = true;
            splash.classList.add('is-leaving');
            window.setTimeout(function () { splash.remove(); }, 550);
        };
        window.setTimeout(hideSplash, 2400);
        splash.addEventListener('click', hideSplash);
        document.addEventListener('keydown', hideSplash);
    }

    /* ---------- 工具 ---------- */
    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function slugify(s) {
        var out = String(s || '').trim().toLowerCase()
            .replace(/\s+/g, '-').replace(/[^\w\u4e00-\u9fa5-]+/g, '')
            .replace(/-+/g, '-').replace(/^-|-$/g, '');
        return out || ('post-' + Date.now().toString(36));
    }

    var TAG_LABEL = { '世冠': '⚡ 世冠', '联赛': '🏆 联赛', '杯赛': '🥇 杯赛', '里程碑': '🚩 里程碑' };
    function tagLabel(t) { return TAG_LABEL[t] || (t ? '· ' + t : '资讯'); }

    /* ---------- 归一化：兼容 Supabase 返回的行 ---------- */
    function normal(r, i) {
        if (!r || typeof r !== 'object') return null;
        var title = r.title || r.name || '未命名资讯';
        return {
            slug:     r.slug || r.key || slugify(title) || ('post-' + i),
            title:    title,
            summary:  r.summary || r.excerpt || r.desc || '',
            body:     r.body || r.content || r.summary || '',
            date:     String(r.date || r.created_at || r.published_at || '').slice(0, 10),
            league:   r.league || r.category || '',
            tag:      r.tag || r.type || '',
            author:   r.author || r.byline || '',
            hero:     r.hero === true || r.hero === 'true' || r.featured === true
        };
    }

    /* ---------- 卡片模板 ---------- */
    function metaHtml(a) {
        var parts = [];
        if (a.date)   parts.push('<span>' + esc(a.date) + '</span>');
        if (a.league) parts.push('<span class="sep">·</span><span>' + esc(a.league) + '</span>');
        if (a.tag)    parts.push('<span class="sep">·</span><span class="tag">' + esc(a.tag) + '</span>');
        if (a.author) parts.push('<span class="sep">·</span><span>' + esc(a.author) + '</span>');
        return parts.join('');
    }

    function cardHtml(a) {
        var href = 'article.html?slug=' + encodeURIComponent(a.slug);
        var head = esc(a.title);
        if (a.hero) {
            return '<a class="hero-card" href="' + href + '" style="display:block;text-decoration:none;color:inherit">' +
                       '<div class="hero-tag">⚡ FEATURED</div>' +
                       '<div class="hero-title">' + head + '</div>' +
                       (a.summary ? '<div class="hero-summary">' + esc(a.summary) + '</div>' : '') +
                       '<div class="card-meta">' + metaHtml(a) + '</div>' +
                   '</a>';
        }
        return '<a class="news-card" href="' + href + '" style="display:block;text-decoration:none;color:inherit">' +
                   '<div class="news-title">' + head + '</div>' +
                   (a.summary ? '<div class="news-summary">' + esc(a.summary) + '</div>' : '') +
                   '<div class="card-meta">' + metaHtml(a) + '</div>' +
               '</a>';
    }

    /* ---------- 取数并渲染 ---------- */
    var all = [];
    var feed = document.getElementById('feed');
    var feedCount = document.getElementById('feed-count');
    var filterBar = document.getElementById('filter-bar');
    var srcNote = document.getElementById('src-note');
    var navBar = document.getElementById('nav-leagues');
    var panelRank = document.getElementById('panel-rank');
    var panelRecent = document.getElementById('panel-recent');
    var panelHeat = document.getElementById('panel-heat');
    var statCheers = document.getElementById('stat-cheers');
    var activeTag = '全部';       /* 分类筛选：世冠 / 联赛 / 杯赛 / 里程碑 */
    var activeLeague = '';        /* 顶栏联赛筛选：空 = 首页（全部内容） */
    var titles = [];              /* 冠军记录，右栏统计用 */

    /* 顶栏联赛切换：同步高亮 + 更新地址栏，便于分享和收藏 */
    function setLeague(league) {
        activeLeague = league || '';
        /* 切换分栏时重置分类筛选，避免"切回首页却还带着某个分类"的困惑 */
        activeTag = '全部';
        if (navBar) {
            var links = navBar.querySelectorAll('a');
            for (var i = 0; i < links.length; i++) {
                var isOn = (links[i].getAttribute('data-league') || '') === activeLeague;
                links[i].className = isOn ? 'active' : '';
            }
        }
        var url = activeLeague
            ? 'index.html?league=' + encodeURIComponent(activeLeague)
            : 'index.html';
        if (window.history && history.replaceState) {
            history.replaceState(null, '', url);
        }
    }

    /* 当前生效的文章集合：先按联赛，再按分类 */
    function visibleRows() {
        return all.filter(function (a) {
            if (activeLeague && a.league !== activeLeague) return false;
            if (activeTag !== '全部' && a.tag !== activeTag) return false;
            return true;
        });
    }

    /* 分类按钮只列出"当前联赛范围内"实际存在的分类 */
    function renderFilter() {
        var pool = all.filter(function (a) {
            return !activeLeague || a.league === activeLeague;
        });
        var tags = [];
        pool.forEach(function (a) {
            if (a.tag && tags.indexOf(a.tag) === -1) tags.push(a.tag);
        });
        /* "全部" 放在最前面，符合常规习惯 */
        if (pool.length) tags.unshift('全部');
        if (tags.indexOf(activeTag) === -1) activeTag = '全部';

        filterBar.innerHTML = tags.map(function (t) {
            return '<button type="button" class="filter-btn' + (t === activeTag ? ' active' : '') +
                   '" data-tag="' + esc(t) + '">' + esc(t) + '</button>';
        }).join('');
    }

    /* 首页头条：只认显式标了 hero 的文章，取其中日期最新的那篇。
       没标头条的普通文章，无论多新都只按普通卡片显示。
       返回 null 表示当前没有头条。 */
    function pickHero(rows) {
        var best = null;
        rows.forEach(function (a) {
            if (a.hero !== true) return;
            if (!best || String(a.date || '') > String(best.date || '')) best = a;
        });
        return best;
    }

    function render() {
        var rows = visibleRows();

        var html = '';
        if (!rows.length) {
            var hint = all.length ? '换一个筛选试试' : '等待转录';
            var what = activeLeague ? activeLeague + ' 下' : '这个分类下';
            html = '<div class="empty-state">' + esc(what) + '还没有资讯' +
                   '<span class="mono">' + esc(hint) + '</span></div>';
        } else if (!activeLeague && activeTag === '全部') {
            /* 首页全量视图：把「头条」放最上面用大卡，其余按原顺序排。
               头条由文章的 hero 标记决定，不能因为"它最新"就自动变成头条。 */
            var hero = pickHero(rows);
            if (hero) {
                html += cardHtml(hero);
                /* 用 slug 比对，避免"同一篇文章被渲染两遍"
                   （pickHero 返回的对象不保证和 rows 里是同一个引用） */
                rows.forEach(function (a) {
                    if (a.slug !== hero.slug) html += cardHtml(a);
                });
            } else {
                /* 没有头条时，全部按普通卡片显示（不硬造一个大卡） */
                rows.forEach(function (a) { html += cardHtml(a); });
            }
        } else {
            /* 筛选视图下不用头条大卡，统一小卡更整齐 */
            rows.forEach(function (a) {
                html += cardHtml({ slug: a.slug, title: a.title, summary: a.summary, date: a.date,
                                   league: a.league, tag: a.tag, author: a.author, hero: false });
            });
        }
        feed.innerHTML = html;

        if (!activeLeague && activeTag === '全部') {
            feedCount.textContent = '共 ' + all.length + ' 条';
        } else {
            feedCount.textContent = (activeLeague ? activeLeague + ' · ' : '') +
                (activeTag !== '全部' ? activeTag + ' · ' : '') + rows.length + ' 条';
        }

        /* 开屏只展示真正的头条；没有头条时显示最近更新 */
        if (splash && !introDone) {
            var note = document.getElementById('splash-note');
            if (note && all.length) {
                var h = pickHero(all);
                note.textContent = h ? ('头条 · ' + h.title) : ('最新 · ' + all[0].title);
            }
        }
    }

    /* ---------- 右栏三个面板 ----------
       内容来自冠军记录（titles），由 stats.js 实时统计，
       渲染交给两个页面共用的 panels.js。
       联赛热度例外：它取自第二个项目的助威值，见 panels.js。 */
    function renderPanels() {
        if (!window.VLAPanels) return;
        VLAPanels.render({
            rank: panelRank,
            recent: panelRecent,
            heat: panelHeat
        }, titles);
    }

    /* 左栏"总助威"：来自第二个项目的 40 支球队助威总和 */
    function renderTotalCheers() {
        if (!statCheers || !window.VLA || typeof VLA.totalCheers !== 'function') return;
        VLA.totalCheers().then(function (n) {
            statCheers.textContent = n ? n.toLocaleString('en-US') : '0';
        }).catch(function () {
            statCheers.textContent = '—';
        });
    }

    if (navBar) {
        navBar.addEventListener('click', function (ev) {
            var link = ev.target && ev.target.closest ? ev.target.closest('a[data-league]') : null;
            if (!link) return;
            ev.preventDefault();
            setLeague(link.getAttribute('data-league'));
            renderFilter();
            render();
        });
    }

    filterBar.addEventListener('click', function (ev) {
        var btn = ev.target && ev.target.closest ? ev.target.closest('.filter-btn') : null;
        if (!btn) return;
        activeTag = btn.getAttribute('data-tag') || '全部';
        renderFilter();
        render();
    });

    /* 数据源提示：只有退回内置示例数据时才显示，提醒你去接 Supabase */
    function showSourceNote() {
        if (!srcNote) return;
        if (VLA.source() === 'fallback') {
            srcNote.className = 'src-note show';
            srcNote.innerHTML = '当前显示的是 <b>data.js 内置示例数据</b>（共 ' + all.length +
                ' 条）。接入 Supabase 后，这里会自动换成数据库里的真实资讯 —— ' +
                '打开 <span class="mono">data.js</span> 填上 <span class="mono">SUPABASE_URL</span> 和 ' +
                '<span class="mono">SUPABASE_ANON_KEY</span> 即可。';
        }
    }

    VLA.listArticles().then(function (rows) {
        all = rows.map(normal).filter(Boolean);
        /* 日期倒序；没写日期的排最后 */
        all.sort(function (a, b) {
            return String(b.date || '').localeCompare(String(a.date || ''));
        });
        /* 支持 index.html?league=华超 直接进入某个联赛视图（可分享、可收藏） */
        var wantLeague = params.get('league') || '';
        if (wantLeague && all.some(function (a) { return a.league === wantLeague; })) {
            setLeague(wantLeague);
        } else if (wantLeague) {
            setLeague('');   /* 该联赛还没有文章，退回首页而不是显示空白 */
        }
        renderFilter();
        render();
        showSourceNote();
        /* 冠军记录与文章并行获取；右栏只依赖冠军记录，所以分开处理 */
        return VLA.listTitles();
    }).then(function (rows) {
        titles = rows || [];
        renderPanels();
        renderTotalCheers();
    }).catch(function (err) {
        feed.innerHTML = '<div class="empty-state">读取资讯失败' +
            '<span class="mono">' + esc(err && err.message ? err.message : err) + '</span></div>';
        feedCount.textContent = '读取失败';
        /* 读不到资讯时，右栏仍然要显示（冠军榜和近期夺冠与文章无关） */
        renderPanels();
        renderTotalCheers();
    });
})();
</script>

</body>
</html>
